name: release

# Builds the precompiled binaries that install.sh / install.ps1 download.
# Push a v* tag (or run this workflow manually) to produce a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon; also cross-builds the Intel slice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build x86_64 (Intel Macs)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          set -euo pipefail
          for arch in aarch64-apple-darwin:macos-arm64 x86_64-apple-darwin:macos-x64; do
            target="${arch%%:*}"; name="${arch##*:}"
            mkdir -p "dist/$name"
            cp "target/$target/release/markitdown-rs" "dist/$name/"
            cp README.md install.sh "dist/$name/"
            (cd "dist/$name" && tar czf "../../markitdown-rs-$name.tar.gz" markitdown-rs README.md install.sh)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: markitdown-rs-macos-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/markitdown-rs.exe" dist/
          Copy-Item README.md, install.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath markitdown-rs-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: markitdown-rs-windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
